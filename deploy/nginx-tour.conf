# /etc/nginx/sites-available/tour.unigeo.uz
# Tuzilma: /var/www/tour/index.html (tanlash sahifasi), /kampus/ va /muzey/ (Pano2VR turlari)
server {
    listen 80;
    server_name tour.unigeo.uz;
    root /var/www/tour;
    index index.html;

    # Sahifani faqat o'z saytlarimiz iframe ichida ko'rsata oladi
    add_header Content-Security-Policy "frame-ancestors 'self' https://unigeo.uz https://*.unigeo.uz" always;

    gzip on;
    gzip_types application/javascript text/xml application/xml application/json text/css;

    location = /kampus { return 301 /kampus/; }
    location = /muzey  { return 301 /muzey/; }

    # Plitkalar, rasmlar, media: o'zgarmaydi, uzoq keshlanadi
    location ~* ^/((kampus|muzey)/(tiles|images|media|fonts)|assets)/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "frame-ancestors 'self' https://unigeo.uz https://*.unigeo.uz" always;
        access_log off;
    }

    # Qayta eksportdan keyin darhol yangilanishi kerak
    location ~* \.(html|xml)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://unigeo.uz https://*.unigeo.uz" always;
    }

    location / { try_files $uri $uri/ =404; }
}
